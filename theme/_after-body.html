<script>
/* Larnix navbar + reading-mode (loaded after body):
   1) Highlight the navbar link that matches the CURRENT page (Quarto sometimes
      marks a deep chapter link active on unrelated pages).
   2) A 3-way reading-mode switcher — Light → Sepia → Dark — layered on Quarto's
      native (light/dark-only) toggle. Sepia is the light Bootstrap theme plus a
      `data-lx-mode="sepia"` token override on <html> (see theme SCSS). Light/dark
      reuse Quarto's own stylesheet switching so we never reimplement it. */
(function () {
  function norm(p) { return (p.replace(/index\.html$/, "").replace(/\/$/, "") || "/"); }

  function fixNavActive() {
    var here = norm(location.pathname);
    document.querySelectorAll(".navbar .navbar-nav .nav-link").forEach(function (a) {
      var href = a.getAttribute("href");
      if (!href || href.charAt(0) === "#") return;
      var path;
      try { path = norm(new URL(href, location.href).pathname); } catch (e) { return; }
      var on = path === here;
      a.classList.toggle("active", on);
      if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
  }

  // ── Reading mode (light / sepia / dark) ───────────────────────────────────
  var MODES = ["light", "sepia", "dark"];
  var LABELS = { light: "Light", sepia: "Sepia", dark: "Dark" };
  var KEY = "larnix-mode";

  function quartoIsDark() { return document.body.classList.contains("quarto-dark"); }

  // Drive Quarto's own light/dark switch only when the base scheme must change
  // (sepia and light share the light base; only dark needs the alternate sheet).
  function setQuartoBase(wantDark) {
    if (wantDark !== quartoIsDark() && typeof window.quartoToggleColorScheme === "function") {
      window.quartoToggleColorScheme();
    }
  }

  function getMode() {
    var m = localStorage.getItem(KEY);
    if (MODES.indexOf(m) >= 0) return m;
    return quartoIsDark() ? "dark" : "light"; // first visit: follow Quarto's state
  }

  function updateToggles(mode) {
    var next = MODES[(MODES.indexOf(mode) + 1) % MODES.length];
    var label = "Reading mode: " + LABELS[mode] + " — switch to " + LABELS[next];
    document.querySelectorAll(".quarto-color-scheme-toggle").forEach(function (t) {
      t.setAttribute("title", label);
      t.setAttribute("aria-label", label);
    });
  }

  function applyMode(mode, persist) {
    if (MODES.indexOf(mode) < 0) mode = "light";
    setQuartoBase(mode === "dark");
    document.documentElement.setAttribute("data-lx-mode", mode);
    document.documentElement.classList.toggle("lx-sepia", mode === "sepia");
    if (persist) { try { localStorage.setItem(KEY, mode); } catch (e) {} }
    updateToggles(mode);
  }

  function cycle(ev) {
    if (ev) { ev.preventDefault(); ev.stopImmediatePropagation(); }
    var cur = document.documentElement.getAttribute("data-lx-mode") || getMode();
    applyMode(MODES[(MODES.indexOf(cur) + 1) % MODES.length], true);
    return false;
  }

  function bindToggles() {
    document.querySelectorAll(".quarto-color-scheme-toggle").forEach(function (t) {
      t.onclick = cycle; // replace Quarto's inline 2-state onclick with our cycle
    });
  }

  function run() {
    fixNavActive();
    applyMode(getMode(), false); // restore saved mode (no re-persist)
    bindToggles();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", run);
  else run();
})();
</script>

<script>
/* Larnix live-cell status: show "Setting up…" (not "Running…") while a cell is
   downloading/installing its Python packages.

   quarto-live drives a single per-cell indicator (.exercise-editor-eval-indicator)
   for the whole evaluate() call, so the Run button reads "Running…" even while
   Pyodide is still fetching packages on first use — a one-time download that can
   take many seconds and reads as a hang. We split the package-load phase out:
   pre-load the cell's imports (tagging the active editor .lx-loading-pkg so CSS
   swaps the label to "Setting up…"), THEN hand off to the original evaluate(),
   whose own load step is now a no-op, so "Running…" shows only for real
   execution. A short delay before tagging means already-cached packages (the
   common case after first run) never flash the setup state. */
(function () {
  var LOADING_CLASS = "lx-loading-pkg";
  var DELAY_MS = 150;       // don't flash "Setting up…" for instant cached loads
  var POLL_MS = 100, MAX_TRIES = 200; // wait up to ~20s for the runtime to load
  var firstRun = true;      // first eval of the page always involves a download

  function activeEditors() {
    return Array.prototype.filter.call(
      document.querySelectorAll(".exercise-editor"),
      function (ed) {
        var ind = ed.querySelector(".exercise-editor-eval-indicator");
        return ind && !ind.classList.contains("d-none");
      }
    );
  }

  function patch() {
    var rt = window._exercise_ojs_runtime;
    if (!rt || !rt.PyodideEvaluator) return false;
    var proto = rt.PyodideEvaluator.prototype;
    if (proto.__lxLoadingPatched) return true;
    proto.__lxLoadingPatched = true;

    var originalEvaluate = proto.evaluate;
    proto.evaluate = async function (code) {
      if (code != null && this.pyodide) {
        var editors = [];
        // First eval of the page hands straight off from the runtime bootstrap
        // (which already shows "Setting up…"), so tag immediately to avoid a
        // brief "Running…" flash in the gap; later evals keep the anti-flash delay.
        var delay = firstRun ? 0 : DELAY_MS;
        firstRun = false;
        var timer = setTimeout(function () {
          editors = activeEditors();
          editors.forEach(function (ed) { ed.classList.add(LOADING_CLASS); });
        }, delay);
        try {
          // Download/install any packages this cell imports, up front.
          await this.pyodide.loadPackagesFromImports(code);
        } catch (e) {
          /* swallow — let the original evaluate() surface the real error */
        } finally {
          clearTimeout(timer);
          editors.forEach(function (ed) { ed.classList.remove(LOADING_CLASS); });
        }
      }
      // Packages are cached now, so the original load step is a no-op and the
      // cell correctly shows "Running…" only while the code executes.
      return originalEvaluate.apply(this, arguments);
    };
    return true;
  }

  if (!patch()) {
    var tries = 0;
    var iv = setInterval(function () {
      if (patch() || ++tries >= MAX_TRIES) clearInterval(iv);
    }, POLL_MS);
  }
})();
</script>

<script>
/* Larnix runtime watchdog (review 2026-07-19, finding U3):
   the Pyodide runtime + wheels download from a CDN. On an offline, blocked, or
   very slow network the Run buttons previously never became usable and NO error
   was ever shown — the ₹0 audience on flaky mobile data would read the page as
   broken. This watchdog watches pages that contain live cells and, if the
   runtime still isn't ready after a generous window, shows a dismissible,
   honest alert with a Retry (reload) and a Keep-waiting path. It never
   interferes with a load that eventually succeeds — the banner self-removes. */
(function () {
  var FIRST_WAIT_MS = 45000;   // generous: first load legitimately downloads tens of MB
  var EXTEND_MS = 60000;       // "keep waiting" grants another minute
  var POLL_MS = 1000;

  function hasLiveCells() {
    return !!document.querySelector(".exercise-editor, .exercise-cell");
  }

  function runtimeReady() {
    // Ready = the quarto-live runtime object exists AND its global boot
    // indicator (visible only during the initial Pyodide download) is gone.
    if (!window._exercise_ojs_runtime) return false;
    var boot = document.getElementById("exercise-loading-indicator");
    return !boot || boot.classList.contains("d-none");
  }

  function buildBanner(onRetry, onWait) {
    var wrap = document.createElement("div");
    wrap.className = "lx-runtime-alert";
    wrap.setAttribute("role", "alert");

    var msg = document.createElement("p");
    msg.className = "lx-runtime-alert-msg";
    msg.textContent =
      "The in-browser Python runtime hasn't loaded yet. It downloads once from a " +
      "CDN (a few tens of MB), so a slow, offline, or blocked network can stall it. " +
      "Your reading progress is safe — only the Run buttons are affected.";
    wrap.appendChild(msg);

    var actions = document.createElement("div");
    actions.className = "lx-runtime-alert-actions";
    var retry = document.createElement("button");
    retry.type = "button";
    retry.className = "lx-runtime-alert-btn lx-runtime-alert-btn--retry";
    retry.textContent = "Reload and retry";
    retry.addEventListener("click", onRetry);
    var wait = document.createElement("button");
    wait.type = "button";
    wait.className = "lx-runtime-alert-btn";
    wait.textContent = "Keep waiting";
    wait.addEventListener("click", onWait);
    actions.appendChild(retry);
    actions.appendChild(wait);
    wrap.appendChild(actions);
    return wrap;
  }

  function start() {
    if (!hasLiveCells()) return;
    var banner = null;
    var deadline = Date.now() + FIRST_WAIT_MS;

    var iv = setInterval(function () {
      if (runtimeReady()) {
        clearInterval(iv);
        if (banner) { banner.remove(); banner = null; }
        return;
      }
      if (!banner && Date.now() > deadline) {
        banner = buildBanner(
          function () { location.reload(); },
          function () {
            deadline = Date.now() + EXTEND_MS;
            if (banner) { banner.remove(); banner = null; }
          }
        );
        document.body.appendChild(banner);
      }
    }, POLL_MS);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();
</script>

<script>
/* Larnix chapter progress (review 2026-07-19, finding U1 — MVP):
   localStorage previously held only quiz scores; a learner returning on day 3
   had no "where was I?". This adds, with zero backend:
     1. a "Mark chapter complete" toggle at the end of every chapter/capstone;
     2. ✓ ticks on completed items in the sidebar (every page);
     3. a real progress bar + count on each module landing page (replacing the
        .lx-progress component that previously existed only as demo CSS).
   Progress is device-local (localStorage) and the UI says so — honestly. */
(function () {
  var KEY = "larnix-progress:v1";
  // /modules/<module>/<chNN-slug|capstone>.html → "<module>/<page>"
  var PAGE_RE = /\/modules\/([^\/]+)\/((?:ch\d[^\/]*|capstone))\.html$/;
  var INDEX_RE = /\/modules\/([^\/]+)\/(?:index\.html)?$/;

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") || {}; }
    catch (e) { return {}; }
  }
  function save(map) {
    try { localStorage.setItem(KEY, JSON.stringify(map)); } catch (e) { /* private mode */ }
  }
  function idFromPath(path) {
    var m = PAGE_RE.exec(path);
    return m ? m[1] + "/" + m[2] : null;
  }

  function moduleLinks(moduleSlug) {
    // The floating sidebar lists every chapter + capstone on every page — use
    // it as the single source of the module's page list (no duplicated data).
    var anchors = document.querySelectorAll(
      '#quarto-sidebar a.sidebar-link[href*="/modules/' + moduleSlug + '/"]'
    );
    return Array.prototype.filter.call(anchors, function (a) {
      return PAGE_RE.test(new URL(a.href, location.href).pathname);
    });
  }

  function markSidebar(map) {
    document.querySelectorAll('#quarto-sidebar a.sidebar-link').forEach(function (a) {
      var id = idFromPath(new URL(a.href, location.href).pathname);
      if (!id || !map[id] || !map[id].done) return;
      if (a.querySelector(".lx-done-tick")) return;
      a.classList.add("lx-done");
      var tick = document.createElement("span");
      tick.className = "lx-done-tick";
      tick.setAttribute("aria-hidden", "true");
      tick.textContent = " ✓";
      var sr = document.createElement("span");
      sr.className = "visually-hidden";
      sr.textContent = " (completed)";
      a.appendChild(tick);
      a.appendChild(sr);
    });
  }

  function chapterControl(map, pageId) {
    var host = document.getElementById("quarto-document-content") ||
               document.querySelector("main.content");
    if (!host) return;

    var box = document.createElement("div");
    box.className = "lx-complete";
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "lx-complete-btn";
    var note = document.createElement("p");
    note.className = "lx-complete-note";
    note.textContent = "Progress is saved in this browser only — clearing site data or switching devices resets it.";

    function paint() {
      var done = map[pageId] && map[pageId].done;
      btn.classList.toggle("is-done", !!done);
      btn.textContent = done ? "✓ Chapter complete — tap to undo" : "Mark chapter complete";
      btn.setAttribute("aria-pressed", done ? "true" : "false");
    }
    btn.addEventListener("click", function () {
      if (map[pageId] && map[pageId].done) delete map[pageId];
      else map[pageId] = { done: true, at: new Date().toISOString() };
      save(map);
      paint();
    });
    paint();
    box.appendChild(btn);
    box.appendChild(note);
    host.appendChild(box);
  }

  function moduleProgress(map, moduleSlug) {
    var links = moduleLinks(moduleSlug);
    if (!links.length) return;
    var total = links.length;
    var done = links.filter(function (a) {
      var id = idFromPath(new URL(a.href, location.href).pathname);
      return id && map[id] && map[id].done;
    }).length;

    var header = document.getElementById("title-block-header");
    if (!header) return;
    var wrap = document.createElement("div");
    wrap.className = "lx-progress lx-progress--live";
    var track = document.createElement("div");
    track.className = "lx-track";
    var fill = document.createElement("div");
    fill.className = "lx-fill";
    fill.style.width = Math.round((done / total) * 100) + "%";
    track.appendChild(fill);
    var label = document.createElement("span");
    label.className = "lx-progress-label";
    label.textContent = done + " of " + total + " complete" +
      (done === 0 ? " — finish a chapter and mark it done to track it here" : "");
    wrap.appendChild(track);
    wrap.appendChild(label);
    header.insertAdjacentElement("afterend", wrap);
  }

  function run() {
    var map = load();
    markSidebar(map);
    var pageId = idFromPath(location.pathname);
    if (pageId) chapterControl(map, pageId);
    var idx = INDEX_RE.exec(location.pathname);
    if (idx) moduleProgress(map, idx[1]);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", run);
  else run();
})();
</script>
